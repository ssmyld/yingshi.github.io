<html>
    <body>
    <h1>XX影视搜索播放系统示例</h1>
    1.请输入影片名称<input id="code" type="text" value="无间道" /><br />
    <button onclick="play()">点我播放</button>
    <iframe id="player" allowfullscreen="allowfullscreen" webkitallowfullscreen="true" mozallowfullscreen="true" style="width: 100%; height: 600px;background-color:black;"></iframe>

    <script>
        function play() {
            //网页如果不是utf-8编码   则需要使用encodeURI转义
            poster = document.getElementById("poster").value
            code = document.getElementById("code").value
            adadress = document.getElementById("adadress").value

            document.getElementById("player").src = `https://video.isyour.love/player/getplayer?poster=${poster}&adadress=${adadress}&url=${code}`
        }
        play();
</script>
    </body>
</html>
